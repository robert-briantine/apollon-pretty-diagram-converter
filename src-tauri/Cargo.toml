[package]
name = "diagrammes-activite"
version = "0.1.0"
description = "Diagrammes Appolon JS vers SVG de présentation"
authors = ["Diagrammes"]
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
